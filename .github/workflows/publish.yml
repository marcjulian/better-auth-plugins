name: Publish

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Extract package name from tag
        id: tag
        run: |
          TAG=${GITHUB_REF_NAME}
          PACKAGE="${TAG%-v*}"
          echo "name=$PACKAGE" >> $GITHUB_OUTPUT
          echo "dir=packages/$PACKAGE" >> $GITHUB_OUTPUT
      - name: Build
        run: pnpm build
      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --provenance
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
